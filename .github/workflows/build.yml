name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: List Schemes
        run: xcodebuild -list -project AirSync.xcodeproj

      - name: Compile AirSync Self Compiled
        run: |
          xcodebuild clean build \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

          mkdir -p ./output
          cp -R ./build/Build/Products/Release/AirSync.app ./output/

      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip
      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

