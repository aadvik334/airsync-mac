name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project AirSync.xcodeproj -scheme "AirSync Self Compiled"

      - name: Archive AirSync App
        run: |
          # Create an xcarchive with local ad-hoc signing
          xcodebuild archive \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath ./build/AirSync.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

          mkdir -p ./output
          # Extract the compiled .app bundle from the archive
          cp -R ./build/AirSync.xcarchive/Products/Applications/AirSync.app ./output/

      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip
