name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project AirSync.xcodeproj -scheme "AirSync Self Compiled"

      - name: Build AirSync App
        run: |
          xcodebuild clean build \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p ./output
          # Locate and copy the built application bundle
          APP_PATH=$(find ./build/Build/Products/Release -name "AirSync.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "AirSync.app not found in standard Release directory. Checking all build products..."
            APP_PATH=$(find ./build -name "AirSync.app" -type d | head -n 1)
          fi
          cp -R "$APP_PATH" ./output/

      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip
