name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled"

      - name: Compile AirSync App
        run: |
          xcodebuild clean build \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -destination "platform=macOS,arch=arm64" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

          mkdir -p ./output
          # Locate the built AirSync.app bundle
          find ./build/Build/Products/Release -maxdepth 2 -name "AirSync.app" -exec cp -R {} ./output/ \;

      - name: Verify Application Bundle
        run: |
          if [ ! -d "./output/AirSync.app" ]; then
            echo "Error: AirSync.app was not found in ./output"
            exit 1
          fi

      - name: Compress App
        run: |
          cd ./output
          zip -r AirSync-Self-Compiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync-Self-Compiled.zip
