name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile AirSync
        run: |
          xcodebuild build \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          # Package the compiled app
          mkdir -p ./output
          cp -R ./build/Build/Products/Release/AirSync.app ./output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Self-Compiled
          path: ./output/AirSync.app
